<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 420" role="img" aria-labelledby="title desc">
  <title id="title">Multi-task face attribute estimation pipeline</title>
  <desc id="desc">A grayscale face image passes through five shared convolutional blocks into separate age and gender prediction heads.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#18264a"/></linearGradient>
    <linearGradient id="shared" x1="0" x2="1"><stop stop-color="#4f46e5"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
    <linearGradient id="age" x1="0" x2="1"><stop stop-color="#06b6d4"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
    <linearGradient id="gender" x1="0" x2="1"><stop stop-color="#f97316"/><stop offset="1" stop-color="#db2777"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity=".25"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#a5b4fc"/></marker>
  </defs>
  <rect width="1400" height="420" rx="28" fill="url(#bg)"/>
  <text x="56" y="58" fill="#fff" font-family="Inter,Segoe UI,sans-serif" font-size="25" font-weight="700">One representation. Two learning objectives.</text>
  <text x="56" y="86" fill="#a5b4fc" font-family="Inter,Segoe UI,sans-serif" font-size="15">Shared visual features are optimized for age regression and binary classification at the same time.</text>
  <g filter="url(#shadow)">
    <rect x="55" y="142" width="170" height="150" rx="18" fill="#f8fafc"/>
    <circle cx="140" cy="205" r="42" fill="#dbeafe"/>
    <circle cx="124" cy="198" r="5" fill="#1e293b"/><circle cx="156" cy="198" r="5" fill="#1e293b"/>
    <path d="M119 225 Q140 242 161 225" fill="none" stroke="#1e293b" stroke-width="5" stroke-linecap="round"/>
    <path d="M112 172 Q140 148 168 172" fill="none" stroke="#64748b" stroke-width="8" stroke-linecap="round"/>
    <text x="140" y="275" text-anchor="middle" fill="#0f172a" font-family="Inter,Segoe UI,sans-serif" font-size="16" font-weight="700">128×128 grayscale</text>
  </g>
  <path d="M225 217 H270" stroke="#a5b4fc" stroke-width="3" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect x="285" y="140" width="205" height="154" rx="18" fill="url(#shared)"/>
    <text x="387" y="181" text-anchor="middle" fill="#fff" font-family="Inter,Segoe UI,sans-serif" font-size="16" font-weight="700">SHARED CNN</text>
    <text x="387" y="210" text-anchor="middle" fill="#e0e7ff" font-family="Inter,Segoe UI,sans-serif" font-size="14">Conv → Pool × 5</text>
    <text x="387" y="238" text-anchor="middle" fill="#e0e7ff" font-family="Inter,Segoe UI,sans-serif" font-size="14">32 → 64 → 128</text>
    <text x="387" y="266" text-anchor="middle" fill="#e0e7ff" font-family="Inter,Segoe UI,sans-serif" font-size="14">→ 256 → 512 filters</text>
  </g>
  <path d="M490 217 H540" stroke="#a5b4fc" stroke-width="3" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect x="555" y="140" width="215" height="154" rx="18" fill="#312e81"/>
    <text x="662" y="181" text-anchor="middle" fill="#fff" font-family="Inter,Segoe UI,sans-serif" font-size="16" font-weight="700">FLATTEN</text>
    <text x="662" y="211" text-anchor="middle" fill="#c7d2fe" font-family="Inter,Segoe UI,sans-serif" font-size="14">Shared representation</text>
    <text x="662" y="240" text-anchor="middle" fill="#c7d2fe" font-family="Inter,Segoe UI,sans-serif" font-size="14">learned once</text>
    <text x="662" y="269" text-anchor="middle" fill="#c7d2fe" font-family="Inter,Segoe UI,sans-serif" font-size="14">used twice</text>
  </g>
  <path d="M770 217 H835 M835 217 V155 H875 M835 217 V279 H875" fill="none" stroke="#a5b4fc" stroke-width="3" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect x="890" y="105" width="205" height="100" rx="18" fill="url(#age)"/>
    <text x="992" y="143" text-anchor="middle" fill="#fff" font-family="Inter,Segoe UI,sans-serif" font-size="16" font-weight="700">AGE HEAD</text>
    <text x="992" y="172" text-anchor="middle" fill="#cffafe" font-family="Inter,Segoe UI,sans-serif" font-size="14">Dense 256 → 128 → 1</text>
    <text x="992" y="195" text-anchor="middle" fill="#cffafe" font-family="Inter,Segoe UI,sans-serif" font-size="13">linear regression</text>
    <rect x="1130" y="105" width="210" height="100" rx="18" fill="#083344"/>
    <text x="1235" y="143" text-anchor="middle" fill="#fff" font-family="Inter,Segoe UI,sans-serif" font-size="16" font-weight="700">AGE ESTIMATE</text>
    <text x="1235" y="174" text-anchor="middle" fill="#a5f3fc" font-family="Inter,Segoe UI,sans-serif" font-size="22" font-weight="700">continuous</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="890" y="235" width="205" height="100" rx="18" fill="url(#gender)"/>
    <text x="992" y="273" text-anchor="middle" fill="#fff" font-family="Inter,Segoe UI,sans-serif" font-size="16" font-weight="700">GENDER HEAD</text>
    <text x="992" y="302" text-anchor="middle" fill="#fce7f3" font-family="Inter,Segoe UI,sans-serif" font-size="14">Dense 256 → 128 → 1</text>
    <text x="992" y="325" text-anchor="middle" fill="#fce7f3" font-family="Inter,Segoe UI,sans-serif" font-size="13">sigmoid classifier</text>
    <rect x="1130" y="235" width="210" height="100" rx="18" fill="#500724"/>
    <text x="1235" y="273" text-anchor="middle" fill="#fff" font-family="Inter,Segoe UI,sans-serif" font-size="16" font-weight="700">GENDER LABEL</text>
    <text x="1235" y="304" text-anchor="middle" fill="#fbcfe8" font-family="Inter,Segoe UI,sans-serif" font-size="22" font-weight="700">binary</text>
  </g>
  <text x="55" y="380" fill="#94a3b8" font-family="Inter,Segoe UI,sans-serif" font-size="13">Educational visualization based on the architecture defined in multi-taredacted-secret.ipynb.</text>
</svg>
